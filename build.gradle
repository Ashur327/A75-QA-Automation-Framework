plugins {
    id 'java'
}

group 'org.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.testng:testng:7.6.1'
    implementation 'org.seleniumhq.selenium:selenium-java:4.5.0'
    testImplementation 'io.github.bonigarcia:webdrivermanager:6.0.1'
}

test {
    useTestNG() {
        // Use the TestNG XML suite
        suites file("src/test/resources/TestNG.xml")
        // Dynamically include groups based on Gradle property 'suite', default to 'smoke'
        includeGroups project.findProperty('suite') ?: 'smoke'
    }

    // Ensure reports are generated in standard locations
    reports {
        junitXml.required.set(true)
        junitXml.outputLocation.set(layout.buildDirectory.dir("test-results/test"))
        html.required.set(true)
        html.outputLocation.set(layout.buildDirectory.dir("reports/tests"))
    }

    testLogging {
        events "PASSED", "FAILED", "SKIPPED"
        showStandardStreams = true
    }

    // Pass the test type to your tests as a system property
    systemProperty "testType", project.findProperty('suite') ?: "smoke"
}
