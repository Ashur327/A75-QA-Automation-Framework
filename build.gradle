plugins {
    id 'java'
}

group 'org.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.testng:testng:7.6.1'
    implementation 'org.seleniumhq.selenium:selenium-java:4.5.0'
    testImplementation 'io.github.bonigarcia:webdrivermanager:6.0.1'
}

test {
    useTestNG() {
        // Read the suite XML
        def suiteFilePath = "src/test/resources/TestNG.xml"
        def suiteText = file(suiteFilePath).text

        // Replace ${testType} with Gradle property 'suite' (default to 'smoke')
        def suiteName = project.findProperty('suite') ?: 'smoke'
        def tempSuiteFile = file("${buildDir}/temp-suite.xml")
        tempSuiteFile.text = suiteText.replace('${testType}', suiteName)

        suites tempSuiteFile
    }

    // Pass the suite type to system properties so tests can read it if needed
    systemProperty "testType", project.hasProperty("suite") ? project.getProperty("suite") : "smoke"
}
